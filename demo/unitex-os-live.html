<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Юнітекс OS</title>
<style>
  :root{
    color-scheme: light;
    /* Фірмовий стиль UNITEX — як оперативний фінансовий звіт */
    --paper:#f9f9f7; --surface:#ffffff; --surface-2:#f4f4f0;
    --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
    --line:#e1e0d9; --line-soft:#eeede8;
    --accent:#2a78d6; --accent-soft:#e7f0fb; --accent-ink:#1c5cab;
    --side-bg:#ffffff; --side-ink:var(--ink); --side-muted:var(--ink-2);
    --side-active-bg:var(--accent-soft); --side-active-ink:var(--accent-ink); --side-line:var(--line-soft);
    --tile-bg:var(--surface); --tile-warn-bg:var(--surface); --tile-warn-ink:#d03b3b;
    --th-bg:#2a78d6; --th-ink:#ffffff;
    --chart-surface:#fcfcfb;
    --s1:#2a78d6; --s2:#eb6834;
    --good:#0ca30c; --good-text:#006300; --warn:#fab219; --warn-text:#854F0B;
    --crit:#d03b3b; --crit-text:#d03b3b; --info-text:#1c5cab; --vio-text:#3C3489;
    --good-bg:#E1F5EE; --warn-bg:#FAEEDA; --crit-bg:#FBEAE8; --info-bg:#E6F1FB; --vio-bg:#EEEDFE; --neutral-bg:#f1efe8;
    --del-bg:#e6e5df; --del-text:#5f5e5a;
    --shadow:0 1px 2px rgba(11,11,11,.05),0 4px 14px rgba(11,11,11,.05);
    --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      color-scheme: dark;
      --paper:#0e1319; --surface:#171e26; --surface-2:#1c242e;
      --ink:#f2f5f7; --ink-2:#aeb9c2; --muted:#7d8893;
      --line:#2a333d; --line-soft:#222b34;
      --accent:#4fa3bd; --accent-soft:#173341; --accent-ink:#8ecadd;
      --chart-surface:#1a1a19;
      --s1:#3987e5; --s2:#008300;
      --good-text:#4ec24e; --warn-text:#fab219; --crit:#e66767; --crit-text:#e66767; --info-text:#6da7ec; --vio-text:#b197f5;
      --good-bg:#12301a; --warn-bg:#33290e; --crit-bg:#391717; --info-bg:#14273d; --vio-bg:#241a3d; --neutral-bg:#232c36;
      --del-bg:#232c36; --del-text:#9b9a94;
      --side-bg:#171e26; --tile-bg:#1c242e; --tile-warn-bg:#1c242e; --tile-warn-ink:#e66767;
      --th-bg:#1c2836; --th-ink:#9ec5f4; --s2:#d95926;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --paper:#0e1319; --surface:#171e26; --surface-2:#1c242e;
    --ink:#f2f5f7; --ink-2:#aeb9c2; --muted:#7d8893;
    --line:#2a333d; --line-soft:#222b34;
    --accent:#4fa3bd; --accent-soft:#173341; --accent-ink:#8ecadd;
    --chart-surface:#1a1a19;
    --s1:#3987e5; --s2:#008300;
    --good-text:#4ec24e; --warn-text:#fab219; --crit:#e66767; --crit-text:#e66767; --info-text:#6da7ec; --vio-text:#b197f5;
    --good-bg:#12301a; --warn-bg:#33290e; --crit-bg:#391717; --info-bg:#14273d; --vio-bg:#241a3d; --neutral-bg:#232c36;
    --del-bg:#232c36; --del-text:#9b9a94;
    --side-bg:#171e26; --tile-bg:#1c242e; --tile-warn-bg:#1c242e; --tile-warn-ink:#e66767;
    --th-bg:#1c2836; --th-ink:#9ec5f4; --s2:#d95926;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 16px rgba(0,0,0,.35);
  }
  :root[data-theme="light"]{
    color-scheme: light;
    --paper:#f9f9f7; --surface:#ffffff; --surface-2:#f4f4f0;
    --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
    --line:#e1e0d9; --line-soft:#eeede8;
    --accent:#2a78d6; --accent-soft:#e7f0fb; --accent-ink:#1c5cab;
    --side-bg:#ffffff;
    --tile-bg:var(--surface); --tile-warn-bg:var(--surface); --tile-warn-ink:#d03b3b;
    --th-bg:#2a78d6; --th-ink:#ffffff;
    --chart-surface:#fcfcfb;
    --s1:#2a78d6; --s2:#eb6834;
    --good-text:#006300; --warn-text:#854F0B; --crit:#d03b3b; --crit-text:#d03b3b; --info-text:#1c5cab; --vio-text:#3C3489;
    --good-bg:#E1F5EE; --warn-bg:#FAEEDA; --crit-bg:#FBEAE8; --info-bg:#E6F1FB; --vio-bg:#EEEDFE; --neutral-bg:#f1efe8;
    --del-bg:#e6e5df; --del-text:#5f5e5a;
    --shadow:0 1px 2px rgba(11,11,11,.05),0 4px 14px rgba(11,11,11,.05);
  }

  /* ---- ВАРІАНТИ ОФОРМЛЕННЯ (палітри) ---- */
  :root[data-palette="warm"]{
    --paper:#f7f6f1; --surface-2:#f4f2ea; --line:#e3e1d7; --line-soft:#eceae1;
    --ink:#2b2b28; --ink-2:#6b6a64; --muted:#9b9a94;
    --accent:#0C447C; --accent-soft:#EEF1FB; --accent-ink:#0C447C;
    --side-bg:#fbfaf5; --tile-bg:#F1EFE8; --tile-warn-bg:#FAEEDA; --tile-warn-ink:#854F0B;
    --th-bg:transparent; --th-ink:var(--muted); --s2:#008300;
  }
  :root[data-palette="ocean"]{
    --accent:#0284c7; --accent-ink:#0369a1; --accent-soft:color-mix(in srgb, #0284c7 14%, transparent);
    --side-bg:linear-gradient(180deg,#07395f 0%,#0b5b8f 100%);
    --side-ink:#ffffff; --side-muted:rgba(255,255,255,.68);
    --side-active-bg:rgba(255,255,255,.17); --side-active-ink:#ffffff; --side-line:rgba(255,255,255,.16);
  }
  :root[data-palette="indigo"]{
    --accent:#f97316; --accent-ink:#c2410c; --accent-soft:color-mix(in srgb, #f97316 15%, transparent);
    --side-bg:linear-gradient(180deg,#1e1b4b 0%,#372f8c 100%);
    --side-ink:#ffffff; --side-muted:rgba(255,255,255,.66);
    --side-active-bg:rgba(249,115,22,.28); --side-active-ink:#ffd9bd; --side-line:rgba(255,255,255,.15);
  }
  :root[data-palette="emerald"]{
    --accent:#059669; --accent-ink:#047857; --accent-soft:color-mix(in srgb, #059669 14%, transparent);
    --side-bg:linear-gradient(180deg,#064e3b 0%,#0e7460 100%);
    --side-ink:#ffffff; --side-muted:rgba(255,255,255,.68);
    --side-active-bg:rgba(255,255,255,.17); --side-active-ink:#ffffff; --side-line:rgba(255,255,255,.16);
  }
  :root[data-theme="dark"][data-palette="indigo"]{ --accent-ink:#fdba74 }
  :root[data-theme="dark"][data-palette="ocean"]{ --accent-ink:#7dd3fc }
  :root[data-theme="dark"][data-palette="emerald"]{ --accent-ink:#6ee7b7 }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
    background:var(--paper); color:var(--ink);
    font-size:15px; line-height:1.5; min-height:100vh;
  }
  button{font:inherit}
  :focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
  @media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }
  .article h2{font-size:15px;color:var(--accent-ink);margin:18px 0 6px}
  .article h3{font-size:14px;margin:14px 0 6px;color:var(--ink);text-transform:none;letter-spacing:0}
  .article p,.article li{font-size:14px;color:var(--ink)}
  .article ul,.article ol{padding-left:22px;margin:6px 0}
  .article table{margin:8px 0;font-size:13.5px}
  .article th{background:var(--th-bg);color:var(--th-ink);padding:6px 10px;text-align:left}
  .article td{padding:6px 10px;border-bottom:1px solid var(--line-soft)}
  .article pre{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px;overflow-x:auto;white-space:pre-wrap}
  .article .note{margin:10px 0}

  /* ---------- LOGIN ---------- */
  #login-screen{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:24px}
  .demo-banner{max-width:460px; width:100%; background:var(--warn-bg); color:var(--warn-text);
    border:1px solid color-mix(in srgb, var(--warn) 40%, transparent);
    border-radius:var(--radius); padding:10px 14px; font-size:13.5px}
  .login-card{width:100%; max-width:460px; background:var(--surface);
    border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:32px 28px}
  .brand{display:flex; align-items:center; gap:12px; margin-bottom:6px}
  .brand-logo{height:34px;width:auto;display:block;background:#fff;padding:4px 8px;border-radius:8px}
  .brand-mark{width:40px;height:40px;border-radius:9px;background:var(--accent);
    color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}
  .brand h1{font-size:20px;margin:0;letter-spacing:-.2px}
  .brand small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
  .login-card p.hint{color:var(--ink-2);font-size:13.5px;margin:14px 0 18px}
  .acct-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .acct-chip{flex:1 1 120px; text-align:left; cursor:pointer;
    background:var(--surface-2); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; color:var(--ink); transition:border-color .12s}
  .acct-chip:hover{border-color:var(--accent)}
  .acct-chip.sel{border-color:var(--accent); background:var(--accent-soft)}
  .acct-chip b{display:block;font-size:14px}
  .acct-chip span{font-size:12px;color:var(--ink-2)}
  .acct-chip code{font-size:11.5px;color:var(--muted)}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);
    text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
  .field input{width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:9px;
    background:var(--surface); color:var(--ink); font:inherit}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    border:none;border-radius:9px;padding:10px 18px;cursor:pointer;
    background:var(--accent);color:#fff;font-weight:600}
  .btn:hover{filter:brightness(1.08)}
  .btn.full{width:100%;margin-top:16px}
  .btn.ghost{background:transparent;color:var(--ink-2);border:1px solid var(--line);font-weight:500}
  .btn.ghost:hover{color:var(--ink);border-color:var(--muted);filter:none}
  .login-err{display:none;margin-top:12px;background:var(--crit-bg);color:var(--crit-text);
    border-radius:8px;padding:9px 12px;font-size:13.5px}

  /* палітро-перемикач */
  .pal-row{display:flex;align-items:center;gap:10px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line-soft)}
  .pal-row .lbl{font-size:12.5px;color:var(--muted)}
  .pal-dot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;padding:0}
  .pal-dot.sel{border-color:var(--ink); box-shadow:0 0 0 2px var(--surface) inset}
  .pal-dot[data-pal="finrep"]{background:linear-gradient(135deg,#ffffff 50%,#2a78d6 50%);border:1px solid #c9c8c1}
  .pal-dot[data-pal="warm"]{background:linear-gradient(135deg,#F1EFE8 50%,#0C447C 50%)}
  .pal-dot[data-pal="ocean"]{background:linear-gradient(135deg,#07395f,#0284c7)}
  .pal-dot[data-pal="indigo"]{background:linear-gradient(135deg,#1e1b4b 55%,#f97316 55%)}
  .pal-dot[data-pal="emerald"]{background:linear-gradient(135deg,#064e3b,#059669)}

  /* ---------- APP SHELL ---------- */
  #app{display:none; min-height:100vh}
  .shell{display:flex; min-height:100vh}
  .sidebar{width:228px; flex-shrink:0; background:var(--side-bg); color:var(--side-ink);
    border-right:1px solid var(--line); padding:18px 12px; display:flex; flex-direction:column; gap:4px}
  .sidebar .brand{padding:0 8px 14px; border-bottom:1px solid var(--side-line); margin-bottom:10px}
  .sidebar .brand-mark{width:32px;height:32px;font-size:14px;border-radius:7px}
  .sidebar .brand h1{font-size:15px;color:var(--side-ink)}
  .sidebar .brand small{color:var(--side-muted)}
  .nav-item{display:flex;align-items:center;gap:10px; width:100%; text-align:left;
    background:none;border:none; padding:9px 10px; border-radius:8px;
    color:var(--side-muted); cursor:pointer; font-size:14px; font-weight:500}
  .nav-item:hover{background:var(--side-active-bg); color:var(--side-ink)}
  .nav-item.active{background:var(--side-active-bg); color:var(--side-active-ink); font-weight:600}
  .nav-item .ico{width:20px;text-align:center}
  .sidebar .spacer{flex:1}
  .sidebar .foot{font-size:11.5px;color:var(--side-muted);padding:8px 10px;border-top:1px solid var(--side-line)}

  .main{flex:1; display:flex; flex-direction:column; min-width:0}
  .topbar{display:flex; align-items:center; gap:14px;
    padding:12px 24px; background:var(--surface); border-bottom:1px solid var(--line)}
  .topbar h2{font-size:17px;margin:0;flex:1;letter-spacing:-.2px}
  .topbar .pal-mini{display:flex;gap:6px;align-items:center}
  .topbar .pal-mini .pal-dot{width:20px;height:20px}
  .user-chip{display:flex;align-items:center;gap:10px}
  .avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
  .user-chip .who b{display:block;font-size:13.5px;line-height:1.2}
  .role-badge{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
    color:var(--accent-ink);background:var(--accent-soft);border-radius:20px;padding:1px 8px}
  .content{padding:24px; max-width:1820px; width:100%; margin:0 auto; display:flex;flex-direction:column;gap:20px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow); padding:18px 20px}
  .card h3{margin:0 0 4px;font-size:13px;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.05em}
  .card .sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}

  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
  .tile{background:var(--tile-bg);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;box-shadow:var(--shadow)}
  .tile.warn .val{color:var(--tile-warn-ink)}
  .tile .lbl{font-size:12px;color:var(--ink-2)}
  .tile .val{font-size:24px;font-weight:700;letter-spacing:-.3px;margin-top:3px}
  .tile .delta{font-size:12.5px;margin-top:2px}
  .delta.up{color:var(--good-text)} .delta.down{color:var(--crit-text)}

  /* pills */
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
    border-radius:20px;padding:2px 9px;white-space:nowrap}
  .pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex-shrink:0}
  .pill.t-neutral{background:var(--neutral-bg);color:var(--ink-2)}
  .pill.t-info{background:var(--info-bg);color:var(--info-text)}
  .pill.t-vio{background:var(--vio-bg);color:var(--vio-text)}
  .pill.t-warn{background:var(--warn-bg);color:var(--warn-text)}
  .pill.t-good{background:var(--good-bg);color:var(--good-text)}
  .pill.t-crit{background:var(--crit-bg);color:var(--crit-text)}
  .pill.t-del{background:var(--del-bg);color:var(--del-text)}
  .dirchip{font-size:11px;font-weight:700;letter-spacing:.04em;border-radius:5px;padding:1px 6px}
  .dirchip.imp{background:var(--info-bg);color:var(--info-text)}
  .dirchip.exp{background:var(--vio-bg);color:var(--vio-text)}
  .flag{display:inline-block;font-size:11.5px;font-weight:600;border-radius:5px;padding:1px 6px;margin:1px 2px 1px 0;white-space:nowrap}
  .flag.on{background:var(--good-bg);color:var(--good-text)}
  .flag.off{background:var(--neutral-bg);color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
  .remind{color:var(--crit-text);font-size:12.5px}

  /* table */
  .tablewrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--th-ink);
    background:var(--th-bg);text-align:left;font-weight:700;padding:8px 10px;white-space:nowrap}
  thead th:first-child{border-radius:6px 0 0 6px} thead th:last-child{border-radius:0 6px 6px 0}
  td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
  tr:last-child td{border-bottom:none}
  td.num,th.num{font-variant-numeric:tabular-nums;text-align:right}
  tbody tr:hover{background:var(--surface-2)}
  .cell-muted{color:var(--muted);font-size:12.5px}
  .mono{font-variant-numeric:tabular-nums; white-space:nowrap}

  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .filters input,.filters select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;
    background:var(--surface);color:var(--ink);font:inherit;font-size:13.5px}
  .filters input{flex:1;min-width:150px}

  .docbtn{background:var(--accent-soft);color:var(--accent-ink);border:none;border-radius:7px;
    padding:4px 9px;cursor:pointer;font-size:12.5px;font-weight:600;white-space:nowrap}
  .docbtn:hover{filter:brightness(1.05)}

  /* chart */
  .chart{background:var(--chart-surface);border:1px solid var(--line-soft);border-radius:8px;
    padding:16px 14px 8px; position:relative}
  .bars{display:flex;align-items:flex-end;gap:14px;height:150px;border-bottom:1px solid var(--line); padding:0 4px}
  .bargroup{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:2px;height:100%;position:relative}
  .bar{width:22px;max-width:40%;border-radius:4px 4px 0 0;cursor:default;min-height:2px}
  .bar.s1{background:var(--s1)} .bar.s2{background:var(--s2)}
  .xlabels{display:flex;gap:14px;padding:6px 4px 4px}
  .xlabels span{flex:1;text-align:center;font-size:11.5px;color:var(--muted)}
  .legend{display:flex;gap:16px;margin-top:8px;padding:0 4px 6px;font-size:12.5px;color:var(--ink-2)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  .tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);
    font-size:12px;padding:5px 9px;border-radius:6px;transform:translate(-50%,-110%);
    white-space:nowrap;display:none;z-index:5}

  /* SOP */
  details.sop{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);
    box-shadow:var(--shadow); overflow:hidden}
  details.sop summary{cursor:pointer;padding:14px 18px;font-weight:600;list-style:none;display:flex;align-items:center;gap:10px}
  details.sop summary::-webkit-details-marker{display:none}
  details.sop summary::after{content:"▾";margin-left:auto;color:var(--muted);transition:transform .15s}
  details.sop[open] summary::after{transform:rotate(180deg)}
  details.sop .body{padding:0 18px 16px;color:var(--ink-2);font-size:14px}
  details.sop .body ol{margin:6px 0;padding-left:20px}

  .note{background:var(--accent-soft);color:var(--accent-ink);border-radius:var(--radius);padding:12px 16px;font-size:13.5px}
  .ok{color:var(--good-text);font-weight:700}
  .no{color:var(--muted)}

  /* modal документів */
  .overlay{position:fixed;inset:0;background:rgba(10,16,22,.55);display:none;
    align-items:center;justify-content:center;z-index:50;padding:20px}
  .overlay.open{display:flex}
  .modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);
    max-width:480px;width:100%;padding:22px 24px;border:1px solid var(--line)}
  .modal h3{margin:0 0 2px;font-size:16px}
  .modal .sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}
  .doclist{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
  .docitem{display:flex;align-items:center;gap:10px;border:1px solid var(--line);
    border-radius:9px;padding:10px 12px}
  .docitem .t{flex:1}
  .docitem .t b{display:block;font-size:14px}
  .docitem .t span{font-size:12px;color:var(--muted)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    background:var(--ink);color:var(--paper);border-radius:9px;padding:10px 16px;
    font-size:13.5px;display:none;z-index:60;max-width:90vw;text-align:center}

  @media (max-width:760px){
    .shell{flex-direction:column}
    .sidebar{width:100%;flex-direction:row;flex-wrap:wrap;align-items:center;
      border-right:none;border-bottom:1px solid var(--line);padding:10px}
    .sidebar .brand{border:none;margin:0;padding:0 10px 0 4px}
    .sidebar .spacer,.sidebar .foot{display:none}
    .nav-item{width:auto;padding:7px 10px}
    .content{padding:16px}
    .topbar .pal-mini{display:none}
  }
</style>
</head>
<body>
<!-- ============ ВХІД ============ -->
<div id="login-screen">
  <div class="login-card">
    <div class="brand">
      <img class="brand-logo" id="logo-login" alt="UNITEX">
      <div><h1>Юнітекс OS<small>операційна система компанії</small></h1></div>
    </div>
    <p class="hint">Вхід для співробітників.</p>
    <div class="field"><label for="em">Email</label>
      <input id="em" type="email" autocomplete="username" placeholder="name@unitex.od.ua"></div>
    <div class="field" style="margin-top:10px"><label for="pw">Пароль</label>
      <input id="pw" type="password" autocomplete="current-password"></div>
    <button class="btn full" id="login-btn">Увійти</button>
    <div class="login-err" id="login-err">Не вдалося увійти. Перевір email і пароль.</div>
  </div>
</div>

<!-- ============ ЗАСТОСУНОК ============ -->
<div id="app">
  <div class="shell">
    <nav class="sidebar">
      <div class="brand"><img class="brand-logo" id="logo-side" alt="UNITEX" style="height:28px"></div>
      <div id="nav"></div>
      <div class="spacer"></div>
      <div class="foot">Юнітекс OS · жива система</div>
    </nav>
    <div class="main">
      <div class="topbar">
        <h2 id="page-title"></h2>
        <div class="user-chip">
          <div class="avatar" id="u-avatar"></div>
          <div class="who"><b id="u-name"></b><span class="role-badge" id="u-role">…</span></div>
        </div>
        <button class="btn ghost" id="logout">Вийти</button>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>
</div>

<div class="overlay" id="row-overlay">
  <div class="modal" style="max-width:640px;max-height:85vh;overflow-y:auto">
    <h3 id="row-title"></h3>
    <p class="sub">повна картка угоди · дані живі з бази</p>
    <div id="row-body"></div>
    <button class="btn ghost full" id="row-close" style="margin-top:12px">Закрити</button>
  </div>
</div>
<div class="overlay" id="set-overlay">
  <div class="modal" style="max-width:440px">
    <h3>⚙️ Налаштування</h3>
    <p class="sub">особисті налаштування — зберігаються у твоєму браузері</p>
    <div style="margin:10px 0 4px;font-weight:600;font-size:13.5px">Оформлення</div>
    <div id="pal-settings" style="display:flex;gap:10px;align-items:center;margin:8px 0 4px"></div>
    <p class="sub" id="pal-name"></p>
    <button class="btn ghost full" id="set-close" style="margin-top:10px">Закрити</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = id => document.getElementById(id);
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ===== оформлення (в налаштуваннях користувача) ===== */
let palette = localStorage.getItem("palette") || "finrep";
const PALETTES = [ ["finrep","Фінзвіт (фірмовий)"],["warm","Теплий"],["ocean","Океан"],["indigo","Індиго"],["emerald","Смарагд"] ];
function setPalette(p){ palette=p; localStorage.setItem("palette",p); if(p==="finrep") delete document.documentElement.dataset.palette; else document.documentElement.dataset.palette=p; renderPals(); }
if (palette !== "finrep") document.documentElement.dataset.palette = palette;
function renderPals(){
  const html = PALETTES.map(([p,n])=>`<button class="pal-dot ${p===palette?"sel":""}" data-pal="${p}" title="${n}"></button>`).join("");
  const ps = $("pal-settings"); if (ps) ps.innerHTML = html;
  const pn = $("pal-name"); if (pn) pn.textContent = "Обрано: " + (PALETTES.find(x=>x[0]===palette)||["",""])[1];
  document.querySelectorAll(".pal-dot").forEach(b=>b.addEventListener("click",()=>setPalette(b.dataset.pal)));
}

/* ===== API ===== */
const BASE_ID = "pbhr1qkpvx09z8m";
let T = {};            // назва таблиці -> id
let JWT = sessionStorage.getItem("jwt") || null;
let ROLE = "Перегляд", UNAME = "";
async function api(path, opts={}){
  const h = Object.assign({"Content-Type":"application/json"}, opts.headers||{});
  if (JWT) h["xc-auth"] = JWT;
  const r = await fetch(path, Object.assign({}, opts, {headers:h}));
  if (r.status === 401){ doLogout(); throw new Error("401"); }
  return r.json();
}
async function loadAll(table){
  let out = [], offset = 0;
  while (true){
    const js = await api(`/api/v2/tables/${table}/records?limit=200&offset=${offset}`);
    out = out.concat(js.list||[]);
    if ((js.list||[]).length < 200) break;
    offset += 200;
  }
  return out;
}

/* ===== ролі ===== */
const RC = {
  "Адміністратор":        { nav:["dashboard","dispatch","clients","finance","tasks","instr","users"], scope:"all", fin:"full", sync:true },
  "Сейлз-менеджер":       { nav:["dashboard","dispatch","clients","finance","tasks","instr"], scope:"mgr", fin:"personal", sync:false },
  "Бухгалтер":            { nav:["dashboard","dispatch","clients","finance","tasks","instr"], scope:"all", fin:"acct", sync:true },
  "Фінансист":            { nav:["dashboard","dispatch","clients","finance","tasks","instr"], scope:"all", fin:"full", sync:true },
  "Операційний менеджер": { nav:["dashboard","dispatch","clients","tasks","instr"], scope:"ops", fin:"none", sync:true },
  "Логіст":               { nav:["dispatch","instr"], scope:"all", cols:"logist", fin:"none", sync:false },
  "Перегляд":             { nav:["dashboard","dispatch","clients","finance","tasks","instr"], scope:"all", fin:"blur", sync:false },
};
function cfg(){ return RC[ROLE] || RC["Перегляд"]; }
function scoped(rows){
  const c = cfg();
  if (c.scope === "mgr") return rows.filter(r=>String(r["Менеджер"]||"").trim() === UNAME);
  if (c.scope === "ops") return rows.filter(r=>String(r["Оп. менеджер"]||"").trim() === UNAME);
  return rows;
}

/* ===== вхід/вихід ===== */
async function doLogin(){
  $("login-err").style.display="none";
  try{
    const r = await fetch("/api/v1/auth/user/signin", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({email: $("em").value.trim(), password: $("pw").value})});
    const js = await r.json();
    if (!r.ok || !js.token) throw new Error("bad");
    JWT = js.token; sessionStorage.setItem("jwt", JWT);
    sessionStorage.setItem("email", $("em").value.trim().toLowerCase());
    enter();
  } catch(e){ $("login-err").style.display="block"; }
}
function doLogout(){ JWT=null; sessionStorage.clear(); $("app").style.display="none"; $("login-screen").style.display="flex"; }
async function enter(){
  $("login-screen").style.display="none"; $("app").style.display="block";
  const em = sessionStorage.getItem("email")||"";
  $("u-name").textContent = em.split("@")[0];
  $("u-avatar").textContent = (em[0]||"?").toUpperCase();
  try{
    const meta = await api(`/api/v2/meta/bases/${BASE_ID}/tables`);
    (meta.list||[]).forEach(t=>{ T[t.title] = t.id; });
    if (T["Користувачі"]){
      const u = await api(`/api/v2/tables/${T["Користувачі"]}/records?limit=100`);
      const me = (u.list||[]).find(x=>String(x["Email"]||"").toLowerCase() === em && x["Активний"] !== false);
      if (me){ ROLE = me["Роль"] || "Перегляд"; UNAME = me["Ім'я"] || $("u-name").textContent; }
      else ROLE = "Перегляд";
    }
  } catch(e){ ROLE = "Перегляд"; }
  $("u-role").textContent = ROLE;
  buildNav(); go(cfg().nav[0]);
}
$("login-btn").addEventListener("click", doLogin);
$("pw").addEventListener("keydown", e=>{ if(e.key==="Enter") doLogin(); });
$("logout").addEventListener("click", doLogout);
document.querySelector(".user-chip").style.cursor = "pointer";
document.querySelector(".user-chip").title = "Налаштування";
document.querySelector(".user-chip").addEventListener("click", ()=>{ renderPals(); $("set-overlay").classList.add("open"); });
$("set-close").addEventListener("click", ()=>$("set-overlay").classList.remove("open"));
$("set-overlay").addEventListener("click", e=>{ if(e.target===$("set-overlay")) $("set-overlay").classList.remove("open"); });

/* ===== навігація ===== */
const MODMAP = {
  dashboard:{label:"Дашборд",ico:"📊"}, dispatch:{label:"Диспетчеризація",ico:"🚢"},
  clients:{label:"Клієнти",ico:"👥"}, finance:{label:"Фінанси",ico:"💰"},
  tasks:{label:"Задачі",ico:"✅"}, instr:{label:"Інструкції",ico:"📚"}, users:{label:"Користувачі",ico:"🔐"},
};
function buildNav(){
  $("nav").innerHTML = cfg().nav.map(id=>`<button class="nav-item" data-page="${id}"><span class="ico">${MODMAP[id].ico}</span>${MODMAP[id].label}</button>`).join("");
  $("nav").querySelectorAll(".nav-item").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
}
function go(page){
  if (!cfg().nav.includes(page)) page = cfg().nav[0];
  $("nav").querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("active", b.dataset.page===page));
  $("page-title").textContent = MODMAP[page].label;
  $("content").innerHTML = '<div class="card"><p class="sub">Завантаження…</p></div>';
  PAGES[page]().catch(e=>{ $("content").innerHTML = '<div class="note">⚠ Не вдалося завантажити дані ('+esc(e.message)+'). Спробуй оновити сторінку.</div>'; });
}

/* ===== статуси ===== */
const STATUSES = {
  "Букінг":"t-neutral","Стафіровка":"t-info","В порту відправлення":"t-info",
  "Завантажений на судно":"t-info","В морі":"t-info",
  "Вивантажений в порту прибуття":"t-vio","Завантажений на авто/потяг":"t-good",
  "Вантаж доставлено":"t-del",
};
const stPill = st => st ? `<span class="pill ${STATUSES[st]||"t-neutral"}">${esc(st)}</span>` : '<span class="cell-muted">—</span>';
let toastTimer=null;
function toast(m){ const t=$("toast"); t.textContent=m; t.style.display="block"; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.style.display="none",4000); }

/* ===== сторінки ===== */
const PAGES = {};
let DISP_CACHE = null;
async function dispRows(){ return DISP_CACHE || (DISP_CACHE = await loadAll(T["Диспетчеризація"])); }

PAGES.dashboard = async () => {
  const rows = scoped(await dispRows());
  const active = rows.filter(r=>r["Статус"]!=="Вантаж доставлено");
  const today = new Date(); today.setHours(0,0,0,0);
  const d = v => { const m=/(\d{4})-(\d{2})-(\d{2})/.exec(String(v||"")); return m? new Date(+m[1],+m[2]-1,+m[3]) : null; };
  const sea = active.filter(r=>r["Статус"]==="В морі").length;
  const week = active.filter(r=>{ const e=d(r["ETA"]); return e && (e-today)/86400000>=0 && (e-today)/86400000<=7; }).length;
  const noBL = active.filter(r=>!String(r["BL"]||"").trim()).length;
  const fmtRow = r => `<tr><td class="mono"><b>${esc(r["Угода"])}</b></td><td>${esc(r["Клієнт"]||"—")}</td>
    <td>${esc(r["Судно"]||"—")}</td><td>${stPill(r["Статус"])}</td><td class="mono">${esc(r["ETA"]||"—")}</td></tr>`;
  const upcoming = active.filter(r=>{ const e=d(r["ETA"]); return e && e>=today; })
    .sort((a,b)=>String(a["ETA"]).localeCompare(String(b["ETA"]))).slice(0,8);
  const overdue = active.filter(r=>{ const e=d(r["ETA"]); return e && e<today; })
    .sort((a,b)=>String(a["ETA"]).localeCompare(String(b["ETA"]))).slice(0,8);
  const scopeNote = cfg().scope!=="all" ? `<div class="note">👤 Показано лише твої угоди (${esc(UNAME)}).</div>` : "";
  $("content").innerHTML = `
    ${scopeNote}
    <div class="tiles">
      <div class="tile"><div class="lbl">📦 Активні перевезення</div><div class="val">${active.length}</div><div class="delta">з ${rows.length} угод</div></div>
      <div class="tile"><div class="lbl">🌊 В морі зараз</div><div class="val">${sea}</div></div>
      <div class="tile"><div class="lbl">📅 Прибуття за 7 днів</div><div class="val">${week}</div></div>
      <div class="tile warn"><div class="lbl">🚫 Без BL (не трекаються)</div><div class="val">${noBL}</div><div class="delta">впиши BL — трекінг увімкнеться</div></div>
    </div>
    <div class="card"><h3>📅 Найближчі прибуття</h3><p class="sub">активні угоди за датою ETA, від найближчої</p>
      <div class="tablewrap"><table>
        <thead><tr><th>Угода</th><th>Клієнт</th><th>Судно</th><th>Статус</th><th>ETA</th></tr></thead>
        <tbody>${upcoming.map(fmtRow).join("") || '<tr><td colspan="5" class="cell-muted">Немає активних угод з майбутнім ETA.</td></tr>'}</tbody>
      </table></div></div>
    <div class="card"><h3>⚠️ ETA минуло — перевірити</h3><p class="sub">дата прибуття вже позаду, а угода не закрита: оновити статус або дати</p>
      <div class="tablewrap"><table>
        <thead><tr><th>Угода</th><th>Клієнт</th><th>Судно</th><th>Статус</th><th>ETA</th></tr></thead>
        <tbody>${overdue.map(fmtRow).join("") || '<tr><td colspan="5" class="cell-muted">Таких немає — все під контролем ✅</td></tr>'}</tbody>
      </table></div></div>`;
};

const FLAGS = ["Телекс","Т1","ДО","Документи","SI","Замитнення","Реліз"];
PAGES.dispatch = async () => {
  DISP_CACHE = null;
  const all = scoped(await dispRows());
  all.sort((a,b)=> (parseInt(b["Угода"])||0) - (parseInt(a["Угода"])||0));
  const logist = cfg().cols === "logist";
  const syncBtn = cfg().sync ? '<button class="btn" id="sync-btn">⟳ Оновити з Експедитора</button>' : "";
  const head = logist
    ? "<th>Угода</th><th>Клієнт</th><th>Контейнер</th><th>Статус</th><th>Номер авто</th><th>Водій</th><th>Телефон</th><th>Перетин кордону</th>"
    : "<th>Угода</th><th></th><th>Клієнт</th><th>Лінія</th><th>BL / Контейнер</th><th>Судно</th><th>ETA</th><th>Статус</th><th>Позначки</th><th>Коментар</th>";
  $("content").innerHTML = `
    <div class="card">
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
        <h3 style="margin:0">🚢 Диспетчеризація</h3>
        <span class="sub" style="margin:0">угод: ${all.length}${cfg().scope!=="all"?" (лише твої)":""} · клік по рядку — картка</span>
        <span style="flex:1"></span>${syncBtn}
      </div>
      <div class="filters" style="margin-top:12px">
        <input id="q" placeholder="Пошук: угода, клієнт, BL, контейнер, судно…">
        <select id="stf"><option value="">Усі статуси</option>${Object.keys(STATUSES).map(s=>`<option>${s}</option>`).join("")}</select>
        <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)"><input type="checkbox" id="actf" checked> лише активні</label>
      </div>
      <div class="tablewrap"><table>
        <thead><tr>${head}</tr></thead>
        <tbody id="drows"></tbody></table></div>
    </div>`;
  const draw = () => {
    const q=$("q").value.toLowerCase(), st=$("stf").value, act=$("actf").checked;
    const list = all.filter(r =>
      (!st || r["Статус"]===st) && (!act || r["Статус"]!=="Вантаж доставлено") &&
      (!q || [r["Угода"],r["Клієнт"],r["BL"],r["Контейнер"],r["Судно"],r["Номер авто"],r["Водій (ПІБ)"]].join(" ").toLowerCase().includes(q)));
    $("drows").innerHTML = list.length ? list.map(r=> logist ? `
      <tr data-id="${r.Id}" style="cursor:pointer">
        <td class="mono"><b>${esc(r["Угода"])}</b></td><td>${esc(r["Клієнт"]||"—")}</td>
        <td class="mono">${esc(r["Контейнер"]||"—")}</td><td>${stPill(r["Статус"])}</td>
        <td class="mono">${esc(r["Номер авто"]||"—")}</td><td>${esc(r["Водій (ПІБ)"]||"—")}</td>
        <td class="mono">${esc(r["Водій (телефон)"]||"—")}</td><td class="mono">${esc(r["Перетин кордону (факт)"]||"—")}</td>
      </tr>` : `
      <tr data-id="${r.Id}" style="cursor:pointer">
        <td class="mono"><b>${esc(r["Угода"])}</b></td>
        <td>${r["Напрямок"]?`<span class="dirchip ${r["Напрямок"]==="Імпорт"?"imp":"exp"}">${r["Напрямок"]==="Імпорт"?"ІМП":(r["Напрямок"]==="Експорт"?"ЕКС":"ТРН")}</span>`:""}</td>
        <td>${esc(r["Клієнт"]||"—")}</td>
        <td>${esc(r["Лінія"]||"—")}</td>
        <td class="mono">${esc(r["BL"]||"—")}<br><span class="cell-muted">${esc(r["Контейнер"]||"")}</span></td>
        <td>${esc(r["Судно"]||"—")}</td>
        <td class="mono">${esc(r["ETA"]||"—")}</td>
        <td>${stPill(r["Статус"])}</td>
        <td>${FLAGS.filter(f=>r[f]).map(f=>`<span class="flag on">${f} ✓</span>`).join("")||'<span class="cell-muted">—</span>'}</td>
        <td class="cell-muted" style="max-width:220px">${esc(r["Коментар"]||"")}</td>
      </tr>`).join("") : `<tr><td colspan="10" class="cell-muted">Нічого не знайдено.</td></tr>`;
    $("drows").querySelectorAll("tr[data-id]").forEach(tr=>tr.addEventListener("click",()=>openRow(all.find(x=>String(x.Id)===tr.dataset.id))));
  };
  ["q","stf","actf"].forEach(id=>$(id).addEventListener(id==="q"?"input":"change",draw));
  draw();
  const sb = $("sync-btn");
  if (sb) sb.addEventListener("click", async ()=>{
    sb.disabled=true; sb.textContent="⏳ Оновлюю…";
    try{
      const r = await fetch("/sync"); const js = await r.json();
      const m = /new=(\d+)/.exec(js.result||"");
      toast(m && m[1]!=="0" ? `✅ Додано нових угод: ${m[1]}` : "✅ Синхронізовано, нових угод немає");
      DISP_CACHE=null; go("dispatch");
    } catch(e){ toast("⚠ Не вдалося оновити — спробуй ще раз"); }
    finally{ sb.disabled=false; sb.textContent="⟳ Оновити з Експедитора"; }
  });
};

const CARD_GROUPS = [
  ["Основне", ["Угода","Напрямок","Клієнт","Лінія","Тип","Перевізник","Агент","Маршрут","BL","Контейнер","Тип обладнання","Кількість","Вивіз (Carrier/Merchant)","Сухий порт","Адреса розмитнення"]],
  ["Море", ["Судно","Вояж","Контейнер (лінія)","Звірка","Статус","ETA","ETD (план)","ETD (факт)","ETA порт (план)","ETA порт (факт)","Зміни ETA (історія)","Остання зміна","Останнє оновлення"]],
  ["Дати на землі", ["Подача авто (план)","Подача авто (факт)","Port Cut Off","Гейт ін","Вивантаження в порту (факт)","Постановка/завантаження (план)","Постановка/завантаження (факт)","Перетин кордону (факт)","Планова до клієнта (план)","Планова до клієнта (факт)","Вивантаження у отримувача (факт)"]],
  ["Авто і документи", ["Номер авто","Номер ЦМР","Водій (ПІБ)","Водій (телефон)","Телекс","Т1","ДО","Документи","SI","Замитнення","Реліз"]],
  ["Команда і коментарі", ["Менеджер","Оп. менеджер","Лист (джерело)","Нагадування","Коментар","Коментар клієнту"]],
];
const LOGIST_GROUPS = [
  ["Основне", ["Угода","Клієнт","Контейнер","Статус","Маршрут","Сухий порт"]],
  ["Авто", ["Номер авто","Номер ЦМР","Водій (ПІБ)","Водій (телефон)","Перетин кордону (факт)","Постановка/завантаження (план)","Постановка/завантаження (факт)"]],
];
function openRow(r){
  const groups = cfg().cols === "logist" ? LOGIST_GROUPS : CARD_GROUPS;
  $("row-title").textContent = `Угода №${r["Угода"]} · ${r["Клієнт"]||""}`;
  $("row-body").innerHTML = groups.map(([g,fields])=>{
    const items = fields.map(f=>{
      let v = r[f];
      if (typeof v === "boolean" || FLAGS.includes(f)) v = r[f] ? "✓ так" : "—";
      if (v===null || v===undefined || v==="") v = "—";
      return `<tr><td class="cell-muted" style="width:45%">${esc(f)}</td><td>${f==="Статус"?stPill(r["Статус"]):esc(v)}</td></tr>`;
    }).join("");
    return `<h3 style="margin-top:14px">${g}</h3><div class="tablewrap"><table><tbody>${items}</tbody></table></div>`;
  }).join("");
  $("row-overlay").classList.add("open");
}
$("row-close").addEventListener("click",()=>$("row-overlay").classList.remove("open"));
$("row-overlay").addEventListener("click",e=>{ if(e.target===$("row-overlay")) $("row-overlay").classList.remove("open"); });

PAGES.clients = async () => {
